<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maa Ambe Jewellers - Customer Portal</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Navbar & Mode Switcher -->
  <header class="navbar">
    <div class="logo">✨ Maa Ambe Jewellers</div>
    <div class="nav-right">
      <select id="languageSelect" onchange="changeLanguage(this.value)">
        <option value="en">English</option>
        <option value="hi">हिंदी</option>
      </select>
      <button class="btn-switch" onclick="switchToVendorPortal()">🔄 Switch to Vendor Portal</button>
      <button id="authBtn" class="btn-primary" onclick="openAuthModal()">Sign Up / Login</button>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <nav class="sub-nav">
    <button onclick="showSection('catalog')">Jewellery Catalog</button>
    <button onclick="showSection('wishlist')">Wishlist ❤️ (<span id="wishCount">0</span>)</button>
    <button onclick="showSection('cart')">Cart / Tray 🛒 (<span id="cartCount">0</span>)</button>
    <button onclick="showSection('bookings')">My Bookings 📜</button>
  </nav>

  <!-- Main Container -->
  <main class="container">
    <!-- Catalog Section -->
    <section id="catalogSection" class="active-section">
      <h2>Exclusive Collection</h2>
      <div id="productGrid" class="grid-container">
        <!-- Products injected via JS -->
      </div>
    </section>

    <!-- Wishlist Section -->
    <section id="wishlistSection" class="hidden-section">
      <h2>Your Saved Wishlist</h2>
      <div id="wishlistGrid" class="grid-container"></div>
    </section>

    <!-- Cart Section -->
    <section id="cartSection" class="hidden-section">
      <h2>Your Tray / Cart</h2>
      <div id="cartGrid" class="grid-container"></div>
    </section>

    <!-- Bookings Section -->
    <section id="bookingsSection" class="hidden-section">
      <h2>Your Booking Requests</h2>
      <div id="bookingsList"></div>
    </section>
  </main>

  <!-- Auth Modal -->
  <div id="authModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeAuthModal()">&times;</span>
      <h3 id="modalTitle">Customer Authentication</h3>
      
      <!-- Phone Step -->
      <form id="phoneForm" onsubmit="handlePhoneSubmit(event)">
        <input type="tel" id="phoneNumber" placeholder="Enter 10-digit Phone Number" required>
        <button type="submit" class="btn-primary">Verify Number</button>
      </form>

      <!-- Full Signup Form (Appears if New User) -->
      <form id="signupForm" class="hidden-section" onsubmit="handleCustomerSignup(event)">
        <input type="text" id="fullName" placeholder="Full Name" required>
        <input type="email" id="emailAddr" placeholder="Email Address (Optional)">
        <input type="text" id="zipCode" placeholder="ZIP Code (Optional)">
        <input type="text" id="otpInput" placeholder="Enter OTP (Use: 1234)" required>
        <button type="submit" class="btn-primary">Complete Profile & Generate ID</button>
      </form>

      <!-- Quick Login Form (Appears if Returning User) -->
      <form id="loginForm" class="hidden-section" onsubmit="handleCustomerLogin(event)">
        <input type="text" id="loginOtpInput" placeholder="Enter OTP (Use: 1234)" required>
        <button type="submit" class="btn-primary">Sign In</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
