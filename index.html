<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUVARNA - Royal Heritage</title>
<link rel="stylesheet" href="css/style.css">
<style>
/* CRITICAL CSS - Link toote bhi toh design safe rahega */
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',serif}
:root{--maroon:#5C0A2C;--gold:#D4AF37;--cream:#FFFBF0;--green:#0B6B3A;--orange:#FF9933}
body{background:var(--cream);border:4px solid var(--gold)}
.header{background:var(--maroon);color:var(--gold);padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:22px;font-weight:900;letter-spacing:1.5px}
.menubar{background:#FFF8E7;display:flex;gap:16px;padding:12px 18px;overflow-x:auto;white-space:nowrap;border-bottom:2px solid #E8D5B5; -webkit-overflow-scrolling:touch}
.menubar a{color:#3D1A1A;text-decoration:none;font-weight:700;font-size:13px}
.menubar a.active{border-bottom:2.5px solid var(--gold)}
.vendor-btn{background:linear-gradient(180deg,#E8C56A,#C19A3C);padding:7px 16px;border-radius:20px;font-weight:800}
.hero{position:relative;min-height:520px;display:flex;background:#1A0A12}
.hero-text{width:100%;padding:38px 20px;z-index:2}
.hero-text h1{color:#FFE9B0;font-size:30px;line-height:1.15;font-weight:900}
.hero-img{position:absolute;right:0;top:0;width:58%;height:100%;background:url('https://images.unsplash.com/photo-1601821765780-754fa98637c1?q=80&w=800') center top / cover;mask-image:linear-gradient(to left,black 70%,transparent)}
.shop-btn{background:var(--orange);color:#fff;border:none;padding:12px 26px;border-radius:25px;font-weight:800;margin-top:18px;font-size:15px}
.strip{background:var(--green);color:#fff;display:flex;justify-content:space-around;padding:10px;font-size:10px;font-weight:600;flex-wrap:wrap}
</style>
</head>
<body>
<div class="header">
<div class="logo">👑 SUVARNA</div>
<div>🔍 <span id="cart">🛒<sup id="cart-count">0</sup></span></div>
</div>

<div class="menubar" id="menubar">
<a class="active">Home</a><a>New Arrivals</a><a>Gold Jewellery</a><a>Diamond</a><a>Silver</a><a>Bridal</a><a>Offers</a><a>Our Stores</a><a>About Us</a>
<a class="vendor-btn" href="vendor-portal.html">Vendor Login</a>
</div>

<div class="hero">
<div class="hero-text">
<h1>ROYAL HERITAGE,<br>CRAFTED FOR<br>GENERATIONS</h1>
<p style="color:#E8D5B5;margin-top:10px;font-size:13px;line-height:1.4">22kt Gold • VVS Diamonds • Freshwater Pearls<br>Handcrafted for Modern Indian Bride</p>
<button class="shop-btn" onclick="addToCart()">Shop Now →</button>
</div>
<div class="hero-img"></div>
</div>

<div class="strip">
<span>🚚 FREE SHIPPING</span><span>🛡️ CERTIFIED</span><span>↩️ 30-DAY RETURN</span><span>🔒 SECURE</span>
</div>

<script src="js/main.js"></script>
</body>
</html>
