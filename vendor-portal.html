<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURIA - Vendor Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<div class="phone-viewport">
    <div class="header">
        <div class="brand-logo">AURIA</div>
        <a href="../index.html" class="nav-link-btn">✕ Customer View</a>
    </div>

    <div class="content">
        <div style="margin-bottom: 12px; text-align: center;">
            <h2 style="font-family:'Cinzel', serif; color: var(--maroon); font-size: 16px;">Vendor & Partner Portal</h2>
        </div>

        <!-- Internal Role Selector Tabs -->
        <div class="vendor-subtabs">
            <button class="subtab-btn active" onclick="switchVendorSubTab('vendor-me', event)">Vendor</button>
            <button class="subtab-btn" onclick="switchVendorSubTab('vendor-admin', event)">Admin Ops</button>
            <button class="subtab-btn" onclick="switchVendorSubTab('vendor-superadmin', event)">Super Admin</button>
        </div>

        <!-- 1. Vendor Own Tab -->
        <div id="subtab-vendor-me" class="vendor-content-tab">
            <div class="card">
                <span class="card-title">Vendor Account Status</span>
                <div class="card-value">Verified Partner</div>
            </div>
            <div class="card">
                <button class="btn btn-gold">+ Upload Jewelry SKU</button>
            </div>
        </div>

        <!-- 2. Admin Operations Tab -->
        <div id="subtab-vendor-admin" class="vendor-content-tab" style="display:none;">
            <div class="card">
                <span class="card-title">Admin Review Queue</span>
                <div class="card-value" style="color: #B78103;">8 Pending SKUs</div>
                <button class="btn btn-emerald">Open Verification Desk</button>
            </div>
        </div>

        <!-- 3. Super Admin Tab -->
        <div id="subtab-vendor-superadmin" class="vendor-content-tab" style="display:none;">
            <div class="card">
                <span class="card-title">Platform GMV & Revenue</span>
                <div class="card-value">₹14.60 Crore</div>
                <button class="btn btn-maroon">Manage Permissions</button>
            </div>
        </div>

    </div>
</div>

<script src="../assets/js/main.js"></script>
</body>
</html>
